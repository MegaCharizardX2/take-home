name: Pipeline 2 release
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: outpost-infra
  cancel-in-progress: false
env:
  TRIVY: aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
jobs:
  publish:
    if: github.repository == 'MegaCharizardX2/take-home' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    outputs:
      tasky: ${{ steps.push.outputs.tasky }}
      busybox: ${{ steps.push.outputs.busybox }}
      tasky_config: ${{ steps.push.outputs.tasky_config }}
      busybox_config: ${{ steps.push.outputs.busybox_config }}
      revision: ${{ steps.push.outputs.revision }}
    env:
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build Tasky and check its marker
        env:
          CANDIDATE_NAME: ${{ secrets.CANDIDATE_NAME }}
        run: bash ops/release/images.sh build
      - name: Scan both linux/amd64 images
        run: bash ops/release/images.sh scan
      - name: Authenticate image publisher
        env:
          ARM_CLIENT_ID: ${{ vars.IMAGE_PUBLISHER_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: bash ops/release/login.sh
      - name: Push and verify scanned image identities
        id: push
        env:
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: bash ops/release/images.sh push
      - name: Remove private inputs and credentials
        if: always()
        run: rm -rf -- tasky/wizexercise.txt "$RUNNER_TEMP/outpost-azure" "$RUNNER_TEMP/outpost-docker" "$RUNNER_TEMP/outpost-images"
  deploy:
    needs: publish
    if: github.repository == 'MegaCharizardX2/take-home' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      INGRESS_FQDN: ${{ vars.INGRESS_FQDN }}
      ARM_CLIENT_ID: ${{ vars.RELEASE_CLIENT_ID }}
      RELEASE_PRINCIPAL_ID: ${{ vars.RELEASE_PRINCIPAL_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TASKY_DIGEST: ${{ needs.publish.outputs.tasky }}
      BUSYBOX_DIGEST: ${{ needs.publish.outputs.busybox }}
      TASKY_CONFIG_DIGEST: ${{ needs.publish.outputs.tasky_config }}
      BUSYBOX_CONFIG_DIGEST: ${{ needs.publish.outputs.busybox_config }}
      REVISION: ${{ needs.publish.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Render exact deployment and scan manifests
        run: python3 ops/release/cluster.py render
      - name: Authenticate release identity
        run: bash ops/release/login.sh
      - name: Verify release principal and namespace permissions
        run: python3 ops/release/cluster.py release-gate
      - name: Deploy the scanned digests and wait for the web rollout
        run: python3 ops/release/cluster.py deploy
      - name: Verify ready replicas, placement, image digests and marker
        env:
          CANDIDATE_NAME: ${{ secrets.CANDIDATE_NAME }}
        run: python3 ops/release/cluster.py verify
      - name: Verify public TLS readiness and HTTP redirect
        run: python3 ops/release/cluster.py public-route
      - name: Remove private inputs and Azure session
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/outpost-cluster" "$RUNNER_TEMP/outpost-azure"
