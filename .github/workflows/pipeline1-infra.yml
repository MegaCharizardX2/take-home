name: Pipeline 1 - Azure infrastructure
on:
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7:Pipeline 1 requires reviewed backup-stage and bootstrap choices, both restricted to fixed allowlists.
    inputs:
      backup_stage:
        description: Pipeline 1 stage (Outpost is one-way; Phase-1 stages are retired)
        type: choice
        required: true
        default: outpost
        options: [outpost]
      target:
        description: Use full on the live lab. Partial targets maintain already-seeded non-live states.
        type: choice
        required: false
        default: full
        options: [full, vault-and-keys, disk-encryption-set]

permissions: {}
concurrency:
  group: outpost-infra
  cancel-in-progress: false

jobs:
  provision:
    if: github.repository == 'MegaCharizardX2/take-home' && github.ref == 'refs/heads/main'
    environment: infra
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"
      TF_VAR_allow_nat_api: ${{ vars.AKS_API_ALLOW_NAT || 'false' }}
      BACKUP_STAGE: ${{ inputs.backup_stage }}
      TARGET: ${{ inputs.target || 'full' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - name: Validate dispatch and sign in as takehome-id
        run: |
          set -euo pipefail
          case "$TARGET/$BACKUP_STAGE" in
            full/outpost|vault-and-keys/outpost|disk-encryption-set/outpost) ;;
            *) echo 'Invalid target and backup stage.' >&2; exit 2 ;;
          esac
          bash infra/pipeline/azure-login.sh
          printf 'TF_DATA_DIR=%s/outpost-tfdata\nVAULT_ACCESS_LEASE_FILE=%s/outpost-vault-lease.json\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Initialize the Entra state backend
        run: terraform -chdir=infra init -input=false -lockfile=readonly -no-color
      # The non-live maintenance target checks the existing vault and grant before key access.
      - name: Reconcile the seeded vault and key administrator
        if: inputs.target == 'vault-and-keys'
        env:
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_aks_api_home_cidr: ${{ secrets.AKS_API_HOME_CIDR }}
        run: bash infra/pipeline/plan-apply.sh foundation "$BACKUP_STAGE"
      - name: Resolve the state-owned vault
        id: vault
        run: |
          set -euo pipefail
          vault=$(terraform -chdir=infra output -raw vault_name)
          [[ $vault =~ ^kv-outpost-[0-9a-f]{10}$ ]]
          printf 'name=%s\n' "$vault" >> "$GITHUB_OUTPUT"
      - name: Admit this runner and verify key access
        id: access
        uses: ./infra/actions/vault-access
        with:
          vault: ${{ steps.vault.outputs.name }}
      - name: Verify power state and the backup CMK prerequisites
        id: preflight
        if: inputs.target == 'full' || inputs.target == ''
        run: bash infra/pipeline/backup-preflight.sh "$BACKUP_STAGE"
      - name: Step A - make existing public storage private
        if: steps.preflight.outputs.private_first == 'true'
        env:
          TF_VAR_storage_step: A
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_aks_api_home_cidr: ${{ secrets.AKS_API_HOME_CIDR }}
        run: bash infra/pipeline/plan-apply.sh full "$BACKUP_STAGE"
      - name: Plan, scan and apply with the backup CMK required
        env:
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_aks_api_home_cidr: ${{ secrets.AKS_API_HOME_CIDR }}
        run: bash infra/pipeline/plan-apply.sh "$TARGET" "$BACKUP_STAGE"
      - name: Close the vault and remove the runner IP
        if: always()
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/outpost-vault-lease.json" ]]; then
            # Refresh the ARM session after a long apply. The cached session is a fallback.
            bash infra/pipeline/azure-login.sh || echo 'Trying cleanup with the existing Azure session.' >&2
            node infra/actions/vault-access/close.cjs
          fi
      - name: Remove private runner files
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/outpost-plans" "$RUNNER_TEMP/outpost-tfdata"
          # Preserve auth for the registered post-action retry if explicit close failed.
          if [[ ! -f "$RUNNER_TEMP/outpost-vault-lease.json" ]]; then
            rm -rf -- "$RUNNER_TEMP/outpost-azure"
          fi
