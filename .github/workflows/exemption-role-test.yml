name: Exemption role test
# One-off proof that the pipeline identity (takehome-id) can create and delete a
# policy exemption through its custom "Takehome Policy Exemption Manager" role.
# The exemption covers only the StorageDisallowPublicAccess rule, only on
# takehome-rg, expires after one hour, and is deleted in the same job.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_CLIENT_ID: e385971d-1531-4f39-8247-22e338dac0a8
  AZURE_TENANT_ID: a816de9e-88b2-4fd8-9afc-84d67d5b0d45
  AZURE_SUBSCRIPTION_ID: 3909be6b-974b-4ff2-ba7a-59c94994bbb6
  EXEMPTION_NAME: takehome-exemption-role-test
  POLICY_RULE: StorageDisallowPublicAccess

jobs:
  exemption-round-trip:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: infra
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Sign in as takehome-id with GitHub OIDC
        run: |
          set -euo pipefail
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          az login --service-principal --username "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" \
            --federated-token "$token" --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          az account show --query "{subscription:id, signedInAs:user.name}" -o json

      - name: Create a one-hour exemption
        run: |
          set -euo pipefail
          scope="/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/takehome-rg"
          assignment="/subscriptions/$AZURE_SUBSCRIPTION_ID/providers/Microsoft.Authorization/policyAssignments/SecurityCenterBuiltIn"
          expires=$(date -u -d '+1 hour' +%Y-%m-%dT%H:%M:%SZ)
          az policy exemption create --name "$EXEMPTION_NAME" --scope "$scope" \
            --policy-assignment "$assignment" --policy-definition-reference-ids "$POLICY_RULE" \
            --exemption-category Waiver --expires-on "$expires" \
            --display-name "Exemption role test (auto-deleted)" \
            --description "Proves takehome-id can create/delete exemptions. Deleted in the same run." \
            --query "{name:name, scope:id, rule:policyDefinitionReferenceIds, expiresOn:expiresOn}" -o json

      - name: Delete the exemption
        if: always()
        run: |
          set -euo pipefail
          scope="/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/takehome-rg"
          az policy exemption delete --name "$EXEMPTION_NAME" --scope "$scope" || true
          remaining=$(az policy exemption list --scope "$scope" --query "[?name=='$EXEMPTION_NAME'] | length(@)" -o tsv)
          echo "Exemptions named $EXEMPTION_NAME remaining: $remaining"
          test "$remaining" = "0"
