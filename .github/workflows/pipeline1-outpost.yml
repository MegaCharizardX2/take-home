name: Pipeline 1 - Outpost VM and evidence
on:
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7:The infra workflow requires fixed, allowlisted Outpost entry points (VM CVE mitigations, backup proof, read-only evidence).
    inputs:
      step:
        description: Outpost step (see docs/outpost-runbook.md for the order)
        type: choice
        required: true
        options: [mitigate-cves, verify-cves, reboot-and-verify-cves, backup-now, inspect, evidence, report]

permissions: {}
concurrency:
  group: outpost-infra
  cancel-in-progress: false

jobs:
  outpost:
    if: github.repository == 'MegaCharizardX2/take-home' && github.ref == 'refs/heads/main'
    environment: infra
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      STEP: ${{ inputs.step }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the step and sign in as takehome-id
        run: |
          set -euo pipefail
          case "$STEP" in
            mitigate-cves|verify-cves|reboot-and-verify-cves|backup-now|inspect|evidence|report) ;;
            *) echo 'Invalid Outpost step.' >&2; exit 2 ;;
          esac
          bash infra/pipeline/azure-login.sh
      - name: Run the reviewed guest step through VM Run Command
        if: inputs.step != 'evidence' && inputs.step != 'report'
        run: |
          set -euo pipefail
          case "$STEP" in
            mitigate-cves) mode=cve-apply ;;
            verify-cves) mode=cve-verify ;;
            reboot-and-verify-cves) mode=cve-reboot-verify ;;
            backup-now) mode=backup ;;
            inspect) mode=inspect ;;
          esac
          bash infra/pipeline/vm-run-command.sh "$mode"
      - name: Read back the Outpost state through ARM
        if: inputs.step == 'evidence' || inputs.step == 'report'
        env:
          AKS_API_HOME_CIDR: ${{ secrets.AKS_API_HOME_CIDR }}
          AKS_API_ALLOW_NAT: ${{ vars.AKS_API_ALLOW_NAT || 'false' }}
        run: bash infra/pipeline/outpost-evidence.sh "$STEP"
      - name: Remove private runner files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/outpost-azure" "$RUNNER_TEMP"/outpost-vm.* "$RUNNER_TEMP"/outpost-evidence.*
