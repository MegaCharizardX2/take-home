apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: outpost-traefik-secret-watch, namespace: wiz-web}
rules:
  - {apiGroups: [""], resources: [secrets], verbs: [list, watch]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: outpost-traefik-secret-watch
  namespace: wiz-web
  annotations:
    checkov.io/skip1: "CKV2_K8S_5=Traefik's required Ingress Secret informer lists and watches wiz-web only, with no Secret write permissions."
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: outpost-traefik-secret-watch}
subjects: [{kind: ServiceAccount, name: traefik, namespace: traefik}]
